<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg_w)"/>
  <!-- Whitener Bottle & Applicator -->
  <g transform="translate(260, 100)">
    <!-- Main Bottle -->
    <rect x="50" y="90" width="140" height="200" rx="25" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Cap / Top -->
    <polygon points="90,90 150,90 140,40 100,40" fill="#22c55e"/>
    <rect x="105" y="15" width="30" height="25" rx="4" fill="#16a34a"/>
    <!-- Label -->
    <rect x="65" y="140" width="110" height="90" rx="8" fill="#1e40af"/>
    <text x="120" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">CORRECTION</text>
    <text x="120" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#facc15" text-anchor="middle">FLUID</text>
    <text x="120" y="220" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">INHALANT SOLVENT</text>
  </g>
  <!-- Warning Shield -->
  <g transform="translate(480, 160)">
    <polygon points="60,10 120,120 0,120" fill="#eab308" stroke="#ca8a04" stroke-width="4"/>
    <text x="60" y="95" font-family="Arial, sans-serif" font-size="55" font-weight="900" fill="#000000" text-anchor="middle">!</text>
    <text x="60" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">HARMFUL INHALANT</text>
  </g>
  <!-- Banner -->
  <rect x="160" y="415" width="480" height="50" rx="25" fill="#059669"/>
  <text x="400" y="447" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">WHITENER &amp; INHALANT TREATMENT</text>
</svg>
