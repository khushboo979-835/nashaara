<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_detox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg_detox)"/>
  <!-- Medical Vitals / ECG Line -->
  <path d="M 50 250 L 250 250 L 280 180 L 310 320 L 340 140 L 370 290 L 400 250 L 750 250" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- IV Bag -->
  <g transform="translate(180, 80)">
    <rect x="0" y="30" width="90" height="130" rx="15" fill="#e0f2fe" opacity="0.9" stroke="#93c5fd" stroke-width="3"/>
    <line x1="45" y1="0" x2="45" y2="30" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="25" y="70" width="40" height="50" rx="5" fill="#38bdf8" opacity="0.6"/>
    <line x1="45" y1="160" x2="45" y2="220" stroke="#bae6fd" stroke-width="4"/>
  </g>
  <!-- Hospital Cross Badge -->
  <g transform="translate(520, 100)">
    <circle cx="60" cy="60" r="55" fill="#ffffff"/>
    <rect x="45" y="25" width="30" height="70" rx="5" fill="#0284c7"/>
    <rect x="25" y="45" width="70" height="30" rx="5" fill="#0284c7"/>
  </g>
  <!-- Banner -->
  <rect x="160" y="415" width="480" height="50" rx="25" fill="#0284c7"/>
  <text x="400" y="447" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">HOSPITAL MEDICAL DETOXIFICATION</text>
</svg>
