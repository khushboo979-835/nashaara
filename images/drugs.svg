<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_drug" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="pill_blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pill_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg_drug)"/>
  <rect y="360" width="800" height="140" fill="#09090b" opacity="0.9"/>
  <!-- Syringe -->
  <g transform="translate(180, 180) rotate(-35)">
    <rect x="0" y="0" width="160" height="36" rx="6" fill="#f8fafc" opacity="0.85" stroke="#94a3b8" stroke-width="2"/>
    <line x1="30" y1="0" x2="30" y2="15" stroke="#0284c7" stroke-width="3"/>
    <line x1="60" y1="0" x2="60" y2="20" stroke="#0284c7" stroke-width="3"/>
    <line x1="90" y1="0" x2="90" y2="15" stroke="#0284c7" stroke-width="3"/>
    <line x1="120" y1="0" x2="120" y2="20" stroke="#0284c7" stroke-width="3"/>
    <rect x="-60" y="10" width="60" height="16" fill="#cbd5e1"/>
    <rect x="-70" y="4" width="10" height="28" rx="2" fill="#64748b"/>
    <polygon points="160,18 240,18" stroke="#cbd5e1" stroke-width="4"/>
  </g>
  <!-- Blister Pack -->
  <rect x="420" y="140" width="180" height="130" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="455" cy="175" r="18" fill="#ef4444"/>
  <circle cx="510" cy="175" r="18" fill="#3b82f6"/>
  <circle cx="565" cy="175" r="18" fill="#10b981"/>
  <circle cx="455" cy="235" r="18" fill="#f59e0b"/>
  <circle cx="510" cy="235" r="18" fill="#8b5cf6"/>
  <circle cx="565" cy="235" r="18" fill="#ec4899"/>
  <!-- Floating Capsules -->
  <g transform="translate(300, 310) rotate(25)">
    <rect x="0" y="0" width="90" height="36" rx="18" fill="url(#pill_blue)" stroke="#334155" stroke-width="2"/>
  </g>
  <g transform="translate(430, 310) rotate(-15)">
    <rect x="0" y="0" width="90" height="36" rx="18" fill="url(#pill_red)" stroke="#334155" stroke-width="2"/>
  </g>
  <!-- Banner -->
  <rect x="180" y="415" width="440" height="50" rx="25" fill="#2563eb"/>
  <text x="400" y="447" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">DRUG ADDICTION REHABILITATION</text>
</svg>
