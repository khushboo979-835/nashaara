<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bottle1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bottle2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Table surface -->
  <rect y="380" width="800" height="120" fill="#0f172a" opacity="0.8"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#475569" stroke-width="3"/>
  <!-- Bottle 1 (Liquor) -->
  <rect x="220" y="160" width="80" height="220" rx="10" fill="url(#bottle1)"/>
  <rect x="245" y="100" width="30" height="60" rx="4" fill="#92400e"/>
  <rect x="240" y="85" width="40" height="15" rx="3" fill="#b45309"/>
  <rect x="230" y="220" width="60" height="80" rx="5" fill="#fef3c7" opacity="0.85"/>
  <text x="260" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">ALCOHOL</text>
  <!-- Bottle 2 (Wine/Beer) -->
  <path d="M 330 380 L 330 220 Q 330 170 355 140 L 355 90 L 375 90 L 375 140 Q 400 170 400 220 L 400 380 Z" fill="url(#bottle2)"/>
  <rect x="340" y="240" width="50" height="60" rx="4" fill="#e0f2fe" opacity="0.85"/>
  <text x="365" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">REHAB</text>
  <!-- Glass with drink -->
  <path d="M 450 260 L 490 260 L 480 340 L 460 340 Z" fill="#f8fafc" opacity="0.4"/>
  <path d="M 453 285 L 487 285 L 480 335 L 460 335 Z" fill="#f59e0b" opacity="0.7"/>
  <rect x="468" y="340" width="4" height="35" fill="#e2e8f0"/>
  <ellipse cx="470" cy="378" rx="20" ry="4" fill="#cbd5e1"/>
  <!-- Cross / Stop Sign / Medical Badge -->
  <circle cx="590" cy="220" r="75" fill="#ef4444" opacity="0.9"/>
  <circle cx="590" cy="220" r="65" fill="none" stroke="#ffffff" stroke-width="8"/>
  <line x1="545" y1="175" x2="635" y2="265" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- Recovery Banner -->
  <rect x="180" y="415" width="440" height="50" rx="25" fill="url(#shield)"/>
  <text x="400" y="447" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">ALCOHOL DE-ADDICTION CARE</text>
</svg>
