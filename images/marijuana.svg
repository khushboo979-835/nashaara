<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg_m)"/>
  <!-- Leaf Symbol -->
  <g transform="translate(400, 220)">
    <!-- Center blade -->
    <path d="M 0 0 C -25 -60 -15 -140 0 -170 C 15 -140 25 -60 0 0 Z" fill="#10b981"/>
    <!-- Left blades -->
    <path d="M 0 0 C -40 -30 -100 -80 -120 -80 C -100 -40 -50 0 0 0 Z" fill="#059669"/>
    <path d="M 0 0 C -50 -10 -130 -30 -150 -15 C -120 0 -50 15 0 0 Z" fill="#047857"/>
    <!-- Right blades -->
    <path d="M 0 0 C 40 -30 100 -80 120 -80 C 100 -40 50 0 0 0 Z" fill="#059669"/>
    <path d="M 0 0 C 50 -10 130 -30 150 -15 C 120 0 50 15 0 0 Z" fill="#047857"/>
    <!-- Stem -->
    <rect x="-4" y="0" width="8" height="60" fill="#047857" rx="3"/>
  </g>
  <!-- Stop Badge -->
  <circle cx="580" cy="180" r="50" fill="#ef4444" opacity="0.9"/>
  <line x1="550" y1="150" x2="610" y2="210" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Banner -->
  <rect x="160" y="415" width="480" height="50" rx="25" fill="#15803d"/>
  <text x="400" y="447" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">MARIJUANA &amp; GANJA RECOVERY</text>
</svg>
