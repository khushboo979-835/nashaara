<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_mh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg_mh)"/>
  <!-- Head Silhouette & Glowing Brain -->
  <g transform="translate(320, 90)">
    <circle cx="80" cy="110" r="85" fill="#14b8a6" opacity="0.3"/>
    <!-- Head Outline -->
    <path d="M 20 220 L 40 170 Q 10 120 40 60 Q 90 10 140 60 Q 170 120 140 170 L 160 220 Z" fill="#ccfbf1" opacity="0.9"/>
    <!-- Brain nodes / lightbulb -->
    <circle cx="90" cy="100" r="30" fill="#fef08a"/>
    <line x1="90" y1="50" x2="90" y2="35" stroke="#fef08a" stroke-width="4"/>
    <line x1="50" y1="80" x2="35" y2="70" stroke="#fef08a" stroke-width="4"/>
    <line x1="130" y1="80" x2="145" y2="70" stroke="#fef08a" stroke-width="4"/>
  </g>
  <!-- Banner -->
  <rect x="160" y="415" width="480" height="50" rx="25" fill="#0d9488"/>
  <text x="400" y="447" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">MENTAL HEALTH &amp; COUNSELING</text>
</svg>
